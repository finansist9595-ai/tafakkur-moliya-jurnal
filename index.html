<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0B2317" />
  <title>Tafakkur Moliya — Trading Jurnal</title>

  <!-- Telegram Mini App rasmiy kutubxonasi -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Recharts uchun zarur (PropTypes birinchi yuklanishi kerak) -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <!-- JSX kodni brauzerning o'zida ishga tushirish uchun (build qadam kerak emas). Versiya aniq belgilangan (7-avlod), eng so'nggi (8) emas -->
  <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>

  <style>
    html, body { margin: 0; padding: 0; background: #0B2317; }
    #root { min-height: 100vh; }
    .tm-err { color: #FBF8F0; background: #4a1f1f; padding: 20px; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
  </style>

  <script>
    window.addEventListener("error", function (e) {
      var root = document.getElementById("root");
      if (root) {
        root.innerHTML =
          '<div class="tm-err">XATOLIK YUZ BERDI:\n\n' + (e.message || "noma'lum") +
          "\n\nFayl: " + (e.filename || "-") + " Qator: " + (e.lineno || "-") + "</div>";
      }
    });
  </script>
</head>
<body>
  <div id="root">
    <div style="color: #B9C4BA; text-align: center; padding: 60px 20px; font-family: sans-serif;">
      Yuklanmoqda...
    </div>
  </div>

  <script>
    (async function () {
      var root = document.getElementById("root");
      function showError(step, err) {
        root.innerHTML = '<div class="tm-err">XATOLIK (' + step + "):\n\n" + (err && err.message ? err.message : err) + "</div>";
      }
      try {
        if (typeof React === "undefined") throw new Error("React CDN'dan yuklanmadi");
        if (typeof ReactDOM === "undefined") throw new Error("ReactDOM CDN'dan yuklanmadi");
        if (typeof Recharts === "undefined") throw new Error("Recharts CDN'dan yuklanmadi");
        if (typeof Babel === "undefined") throw new Error("Babel CDN'dan yuklanmadi");
      } catch (err) {
        showError("kutubxona yuklanishi", err);
        return;
      }

      var code;
      try {
        var resp = await fetch("app.jsx?v=" + Date.now());
        if (!resp.ok) throw new Error("app.jsx topilmadi (HTTP " + resp.status + "). Fayl nomi aynan 'app.jsx' ekanini tekshiring.");
        code = await resp.text();
      } catch (err) {
        showError("app.jsx yuklash", err);
        return;
      }

      var transformed;
      try {
        transformed = Babel.transform(code, { presets: ["react"] }).code;
      } catch (err) {
        showError("JSX kodni aylantirish", err);
        return;
      }

      try {
        var scriptEl = document.createElement("script");
        scriptEl.textContent = transformed;
        document.body.appendChild(scriptEl);
      } catch (err) {
        showError("kodni ishga tushirish", err);
      }
    })();
  </script>
</body>
</html>
